#:schema https://www.schemastore.org/cargo.json

[package]
name = "oxc_estree_codec"
version = "0.2.0"
authors = ["Alpheus <contact@alphe.us>"]
edition.workspace = true
rust-version.workspace = true
description = "A two-way codec between ESTree and oxc's typed AST"
readme = "README.md"
homepage = "https://github.com/telarel/oxc_estree_codec"
repository = "https://github.com/telarel/oxc_estree_codec"
license = "MIT"
keywords = ["oxc", "estree", "codec"]
categories = ["compilers", "web-programming"]
include = ["src/**", "Cargo.toml", "README.md"]

[dependencies]
oxc = { workspace = true, features = ["serialize"] }
sonic-rs = { workspace = true }
